COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="-Wl,-O1 -Wl,--as-needed"

MAKEOPTS="-j12 -l12"
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=5"

CC=clang
CXX=clang++
USE="-systemd -pulseaudio -networkmanager btrfs wayland pipewire wireplumber X"
USE="${USE} iwd"
USE="${USE} vaapi vulkan opengl gles2"
USE="${USE} dbus alsa bluetooth llvm lto"

CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"

L10N="ru en"
LANG="ru_RU.UTF-8"

ACCEPT_LICENSE="*"
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORT_LOGDIR="/var/log/portage"
FEATURES="candy parallel-fetch clean-logs"

ABI_X86="64"
PORTAGE_TMPDIR="/tmp/portage"
